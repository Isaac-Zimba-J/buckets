name: buckets
description: Give every kwacha a job.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  buckets_core:
    path: ../packages/core
  buckets_data:
    path: ../packages/data
  buckets_domain:
    path: ../packages/domain
  buckets_ui_kit:
    path: ../packages/ui_kit
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  freezed_annotation: 3.1.0
  intl: 0.20.3
  riverpod_annotation: 4.0.7

dev_dependencies:
  build_runner: 2.16.1
  flutter_test:
    sdk: flutter
  freezed: 4.0.1
  riverpod_generator: 4.0.9

flutter:
  generate: true
  uses-material-design: true
