name: buckets_ui_kit
description: Design tokens, theme and Bk* components for Buckets.
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  buckets_core:
    path: ../core
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  # Bundled, never fetched: V1 makes no network calls (OFL, see
  # assets/fonts/OFL.txt). Weight 650 renders with the nearest file.
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
    - family: Geist Mono
      fonts:
        - asset: assets/fonts/GeistMono-Medium.ttf
          weight: 500
