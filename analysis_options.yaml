include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/generated_migrations/**"
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # freezed's factory constructors must name the class; Dart 3.13's
    # `new(...)` shorthand doesn't apply to them.
    unnecessary_type_name_in_constructor: false
