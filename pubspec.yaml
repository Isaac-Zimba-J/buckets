name: buckets_workspace
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - app
  - packages/core
  - packages/domain
  - packages/data
  - packages/ui_kit
  - packages/ui_kit/gallery

dev_dependencies:
  melos: 8.10.0
  very_good_analysis: 11.0.0

melos:
  scripts:
    format: dart format --set-exit-if-changed .
    analyze: dart analyze --fatal-infos .
    gen:
      exec:
        command: dart run build_runner build
        concurrency: 1
      packageFilters:
        dependsOn: build_runner
    schema:
      description: Dump the drift schema and regenerate migration test helpers.
      run: >-
        cd packages/data &&
        dart run drift_dev schema dump lib/src/db/buckets_database.dart drift_schemas/ &&
        dart run drift_dev schema generate drift_schemas/ test/generated_migrations/
    tokens: dart run tool/gen_tokens.dart && dart format packages/ui_kit/lib/src/tokens
    test:dart:
      exec:
        command: dart test --coverage=coverage
        concurrency: 1
      packageFilters:
        flutter: false
        dirExists: test
    test:flutter:
      exec:
        command: flutter test --coverage
        concurrency: 1
      packageFilters:
        flutter: true
        dirExists: test
    test: melos run test:dart && melos run test:flutter
